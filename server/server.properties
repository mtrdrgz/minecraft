# Baseline server config. run-server.sh injects the RCON password and the
# generated MOTD at boot; everything else here is authoritative.

white-list=false
enforce-whitelist=false
online-mode=false
pvp=true
difficulty=normal
gamemode=survival
hardcore=false
level-name=world
motd=Create+ 1.0.0
server-port=25565
server-ip=

# RCON is bound to loopback only. The password is regenerated every boot by
# run-server.sh, so the value here is a placeholder that never reaches the wire.
enable-rcon=true
rcon.port=25575
rcon.password=CHANGEME_AT_BOOT
broadcast-rcon-to-ops=false

# The runner is 4 cores. A 176-mod Create pack will blow past the default
# 60s tick watchdog during worldgen and self-terminate; -1 disables that kill.
max-tick-time=-1
view-distance=8
simulation-distance=6

# Saves happen constantly for the world-branch sync. Async chunk writes keep
# the save-off window short.
sync-chunk-writes=false

# Create contraptions and elytra trigger vanilla flight heuristics.
allow-flight=true
spawn-protection=0

network-compression-threshold=256
max-players=20
enable-command-block=true
allow-nether=true
