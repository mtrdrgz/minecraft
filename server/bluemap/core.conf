# BlueMap core settings.
#
# Shipped instead of letting BlueMap write defaults: the default config has
# accept-download set to false and BlueMap refuses to start until a human edits
# it. There is no human on a GitHub runner.

# BlueMap needs the vanilla client jar for block textures and models. This is
# Mojang's own jar from their servers; accepting is required for it to run.
accept-download: true

# The runner has 4 cores and the server needs them. Rendering is the greedy
# part of BlueMap, so it is capped rather than left to grab everything: a
# render storm is felt in-game as tick lag.
render-thread-count: 1

# How long a render task may run before yielding back. Keeps the map from
# starving the server thread during a big initial render.
scan-for-mod-resources: true

data: "bluemap"
