# Overworld map.
#
# SIZE WARNING, read before widening the bounds:
# The world spans 13312x13312 blocks across 610 region files (~624,640 chunks).
# Rendering all of it on one thread takes many hours — more than a single
# 5.4-hour shift — and the resulting tiles run to several GB, which is too much
# to keep in a Git repo.
#
# So the render is bounded to a 4096x4096 box around spawn: ~16,384 chunks,
# roughly 2.5% of the world, which renders in well under one shift and stays a
# few hundred MB. Widen the bounds below if you want more; the cost is render
# time and repo size, both roughly linear in area.

world: "world"
dimension: "minecraft:overworld"
name: "Overworld"
sorting: 0

# Render bounds. Remove these four lines to render the whole world.
min-x: -2048
max-x: 2048
min-z: -2048
max-z: 2048

# Vertical bounds. Trimming the void and the deep underground cuts work with no
# visible loss on a surface map.
min-y: -64
max-y: 320

# Caves double the work and are invisible from above on a surface map.
render-caves: false

ambient-light: 0.1

# Tiles as files. The alternative is a SQL storage, which needs a database the
# runner does not have.
storage: "file"
