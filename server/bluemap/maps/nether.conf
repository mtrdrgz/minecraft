# Nether map.
#
# The Nether has a solid ceiling, so a top-down render shows bedrock and nothing
# else. max-y is cut below the roof so the map shows the actual terrain.

world: "world"
dimension: "minecraft:the_nether"
name: "Nether"
sorting: 1

min-x: -512
max-x: 512
min-z: -512
max-z: 512

min-y: 0
max-y: 100

# Required here, unlike the overworld: without cave rendering the Nether is
# just a ceiling.
render-caves: true

ambient-light: 0.6
storage: "file"
