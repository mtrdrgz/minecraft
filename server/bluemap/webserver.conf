# BlueMap's built-in webserver.
#
# cloudflared connects to this from the same machine and publishes it as
# map.mtrdrgzcid.com, so it binds to loopback only — the runner has no inbound
# connectivity anyway, and binding wider would serve nothing but risk.

enabled: true

# Loopback only: cloudflared is the sole client.
ip: "127.0.0.1"
port: 8100

webroot: "bluemap/web"
