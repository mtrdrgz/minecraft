name: server

# Every run is one server shift. The shift dispatches its own successor a few
# minutes before it ends, so the chain is self-sustaining; watchdog.yml only
# exists to restart the chain if a link breaks.
on:
  workflow_dispatch:
    inputs:
      serve_minutes:
        description: 'Shift length in minutes. Use a small value (e.g. 8) for a smoke test.'
        required: false
        default: '325'
      continue_chain:
        description: 'Dispatch a successor when this shift ends.'
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [start-server]

permissions:
  contents: write   # required to push the world branch

env:
  BUILD_DIR: /home/runner/mcbuild
  RUN_DIR: /home/runner/mcrun
  WORLD_BRANCH: world
  MAP_BRANCH: map
  # Surfaced as env so a step `if:` can read it; secrets context cannot be used there.
  BLUEMAP_ENABLED: 'true'
  # Surfaced as env because the `secrets` context is not available in a step's
  # `if:` condition — only `env` is.
  PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}

jobs:
  # Assembling the server tree takes ~5 minutes cold. Running it as a separate
  # job means the successor can do this work *while the predecessor is still
  # serving*, instead of after it exits — which is what keeps the handoff gap
  # down to a cache restore plus a boot.
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # restore/save are split rather than using actions/cache directly: the
      # combined action saves in its post step even when the job failed, which
      # once cached a half-built tree (NeoForge + mods, no configs). A later run
      # then saw cache-hit=true, skipped the build, and served the broken tree.
      - name: Restore assembled server tree
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: mcbuild-${{ hashFiles('server/mods.lock.json', 'server/server.properties', 'scripts/build-pack.sh') }}

      # Always run. build-pack.sh is idempotent — it reuses the tree only if its
      # own .build-complete marker is present, and rebuilds from scratch
      # otherwise. That marker, not the cache, is the authority on completeness.
      - name: Build server pack
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-pack.sh

      - name: Save assembled server tree
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: mcbuild-${{ hashFiles('server/mods.lock.json', 'server/server.properties', 'scripts/build-pack.sh') }}

  serve:
    needs: prep
    runs-on: ubuntu-latest
    # GitHub kills a job at 360m. Stay under it so shutdown is ours, not theirs.
    timeout-minutes: 355
    # Exactly one server may hold the world at a time. The successor queues here
    # and starts within seconds of the predecessor releasing it.
    concurrency:
      group: minecraft-serve
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore assembled server tree
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: mcbuild-${{ hashFiles('server/mods.lock.json', 'server/server.properties', 'scripts/build-pack.sh') }}

      # Same reasoning as prep: unconditional, guarded by .build-complete.
      - name: Build server pack (cache miss or incomplete tree)
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-pack.sh

      # playit is the primary transport. e4mc remains in the mod set as a
      # fallback only: it was measured closing its tunnel after ~5 idle minutes.
      - name: Install playit agent
        if: ${{ env.PLAYIT_SECRET != '' }}
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$HOME/bin/playitd" \
            https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x "$HOME/bin/playitd"

      - name: Install cloudflared
        if: ${{ env.BLUEMAP_ENABLED == 'true' }}
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 --retry-all-errors             -o "$HOME/bin/cloudflared"             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$HOME/bin/cloudflared"
          "$HOME/bin/cloudflared" --version

      - name: Run server shift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # world branch pushes
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}  # successor dispatch
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          # Stable public endpoint playit assigned, e.g. abc.gl.at.ply.gg:41234.
          # Configured rather than scraped from the agent log, whose format is
          # not a stable interface. Not secret, but kept alongside for clarity.
          PLAYIT_ADDRESS: ${{ vars.PLAYIT_ADDRESS }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DNS_NAME: minecraft.mtrdrgzcid.com
          # BlueMap is HTTP, so a Cloudflare quick tunnel can carry it — unlike
          # the Minecraft port, which is raw TCP and needs playit. Quick tunnels
          # need no credentials, hence no token here; the rotating hostname is
          # absorbed by an Origin Rule instead of by DNS.
          MAP_HOSTNAME: map.mtrdrgzcid.com
          MAP_UPDATE_TOKEN: ${{ secrets.MAP_UPDATE_TOKEN }}
          SERVE_MINUTES: ${{ github.event.inputs.serve_minutes || '325' }}
          AUTOSAVE_MINUTES: '10'
          HANDOFF_LEAD_MINUTES: '12'
          CONTINUE_CHAIN: ${{ github.event.inputs.continue_chain == 'false' && 'false' || 'true' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-server.sh

      # If the shift crashed before its own dispatch fired, start a successor
      # now rather than waiting up to 5 minutes for the watchdog.
      - name: Recover chain on failure
        if: failure() && github.event.inputs.continue_chain != 'false'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN unset — cannot recover the chain"; exit 0
          fi
          echo "shift failed — dispatching a replacement"
          gh workflow run server.yml --repo "$GITHUB_REPOSITORY" --ref main || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ github.run_id }}
          path: |
            /home/runner/mcrun/server.log
            /home/runner/mcrun/playit.log
            /home/runner/mcrun/cloudflared.log
            /home/runner/mcrun/logs/
          retention-days: 7
          if-no-files-found: ignore
