name: cf-inventory

# Read-only dump of the zone's DNS records and Worker routes. Nothing is
# modified. It runs on a runner because the Cloudflare token lives in Actions
# secrets rather than on a laptop.
on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Dump DNS records and worker routes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python3 tools/cf-inventory.py
